        body {
            margin: 0;
            font-family: "Mountains of Christmas", serif;
            font-weight: 400;
            font-style: normal;
            background-color: rgb(245, 90, 79);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .door {
            width: 120px;
            height: 120px;
            background-color: rgb(245, 67, 54);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 12px;
            cursor: pointer;
            transition: 225ms ease-in-out;
            padding: 8px;
            border-radius: 12px;
        }

        .door:hover {
            background-color: rgb(81, 97, 73);
            transform: scale(1.1);
        }

        .door:active {
            background-color: rgb(245, 67, 54);
            transform: scale(1);
        }
    </style>

    <script>
        function openDoor(div, text, background, date) {
            let currentDate = new Date().toISOString().slice(0, 10);
            let audioSuccess = new Audio('glocke.mp3');
            let audioDisabled = new Audio('gesperrt.mp3');

            if (!div.dataset.number) {
                div.dataset.number = div.innerHTML;
            }

            if (currentDate >= date) {
                if (div.innerHTML === div.dataset.number) {
                    div.innerHTML = text;
                    div.style.fontSize = '15px';
                    div.style.backgroundColor = background;
                    audioSuccess.play();
                } else {
                    div.innerHTML = div.dataset.number;
                    div.style.fontSize = '16px';
                    div.style.backgroundColor = 'rgb(245, 67, 54)';
                }
            } else {
                div.innerHTML = 'Du darfst die Tür nicht vorher öffnen';
                div.style.fontSize = '15px';
                div.style.backgroundColor = 'red';
                audioDisabled.play();
                setTimeout(() => {
                    div.innerHTML = div.dataset.number;
                    div.style.fontSize = '16px';
                    div.style.backgroundColor = 'rgb(245, 67, 54)';
                }, 4000);
                return;
            }
        }

        let spruche = [
            'Nimm dir etwas Ruhe und du wirst mehr Energie haben. Finde A!',
            'Lass die kleinen Momente des Glücks nicht an dir vorbeiziehen. Finde B!',
            'Es ist Zeit, dich selbst mit Güte zu behandeln. Finde C!',

            'Echte Freude kommt von innen. Finde E!',

            'Jeder Tag ist eine neue Gelegenheit, etwas Schönes zu erleben. Finde G!',
            'Erlaube dir, deine eigenen Erfolge zu feiern. Finde H!',
            'Glück entsteht oft durch Aufmerksamkeit in kleinen Dingen. Finde I!',
            'Eine positive Einstellung verändert alles. Finde J!',
            'Jeder Tag bringt neue Möglichkeiten, dein Bestes zu geben. Finde K!',
            'Der Winter erinnert uns daran, innezuhalten und nachzudenken. Finde L!',
            'Veränderungen beginnen mit kleinen Schritten. Finde M!',
            'Erlaube dir, einfach nur du selbst zu sein. Finde N!',

            'Verbringe Zeit mit den Menschen, die dir wichtig sind. Finde W!',
            'Die besten Geschenke im Leben sind nicht materiell. Finde X!'
        ];
        let colors = [
            'rgb(102, 138, 83)',
            'rgb(128, 64, 0)',

            'rgb(102, 204, 255)',

        for (let i = 0; i <= 23; i++) {
            let day = i + 1;
            document.body.innerHTML += `<div class="door">${day}</div>`;
        }
        let doors = document.querySelectorAll(".door");
